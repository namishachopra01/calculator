<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <div class="brand">CALC.</div>

    <section class="display">
      <div id="previousOperand" class="previous-operand"></div>
      <div id="currentOperand" class="current-operand">0</div>
    </section>

    <section class="buttons">
      <button class="key utility span-two" data-action="clear">AC</button>
      <button class="key utility" data-action="delete">DEL</button>
      <button class="key operator" data-operator="÷">÷</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key operator" data-operator="×">×</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key operator" data-operator="-">−</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key operator" data-operator="+">+</button>

      <button class="key span-two" data-number="0">0</button>
      <button class="key" data-number=".">.</button>
      <button class="key equals" data-action="equals">=</button>
    </section>

    <p class="hint">Keyboard supported</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
